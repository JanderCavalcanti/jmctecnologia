# Publica o site no GitHub Pages pela branch gh-pages:
# - main  -> raiz do site (domínio principal)
# - teste -> pasta /teste/ (ambiente de teste, fora dos buscadores)
name: Publicar site

on:
  push:
    branches: [main, teste]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Baixar a teste
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" teste >/dev/null; then
            git clone --depth 1 --branch teste "https://github.com/${GITHUB_REPOSITORY}.git" teste
          fi

      - name: Montar o site
        run: |
          # Versão no rodapé: número do arquivo VERSION (na teste, também o commit)
          versao() {
            v="$(tr -d '[:space:]' < "$1/VERSION" 2>/dev/null || true)"
            echo "${v:-dev}$2"
          }
          carimbar() {
            for f in "$1"/*.html; do
              sed -i "s#<span data-versao>[^<]*</span>#<span data-versao>$2</span>#" "$f"
            done
          }

          cp -r main site
          rm -rf site/.git site/.github site/docs site/supabase

          if [ -d teste ]; then
            cp -r teste site/teste
            rm -rf site/teste/.git site/teste/.github site/teste/docs site/teste/supabase site/teste/CNAME
            # Ambiente de teste: fora dos buscadores e com aviso no topo
            for f in site/teste/*.html; do
              sed -i 's#<head>#<head>\n  <meta name="robots" content="noindex, nofollow">#' "$f"
              sed -i 's#<body>#<body>\n  <div style="background:\#404040;color:\#fff;text-align:center;padding:8px 16px;font:600 14px/1.4 Inter,system-ui,sans-serif">Ambiente de teste. Esta versão ainda não está no site oficial.</div>#' "$f"
            done
          fi

          carimbar site "$(versao main)"
          if [ -d teste ]; then
            carimbar site/teste "$(versao teste " (teste $(git -C teste rev-parse --short HEAD))")"
          fi

          touch site/.nojekyll

      - name: Marcar a versão com uma tag
        if: github.ref_name == 'main'
        run: |
          cd main
          v="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          if [ -n "$v" ] && ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            git tag "v$v"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "v$v"
          fi

      - name: Enviar para a branch gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica o site (${GITHUB_REF_NAME} ${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
