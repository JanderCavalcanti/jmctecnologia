# Supabase enxuto para o Easypanel (VPS de 4 GB da JMC).
# Só o que a Área do cliente usa: banco, login (GoTrue), API (PostgREST), tempo real, painel (Studio).
# Sem storage, edge functions, analytics e pooler. Cada serviço tem limite de memória para não
# afetar os outros serviços da VPS. Variáveis no .env do serviço (modelo em env.example).
# O Easypanel publica o "gateway" (porta 80) em https://supabase.jmctecnologia.com.br.

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    # Grava os scripts de inicialização (senhas dos papéis, JWT e schema do realtime) antes de subir.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /docker-entrypoint-initdb.d/init-scripts /docker-entrypoint-initdb.d/migrations
        cat > /docker-entrypoint-initdb.d/init-scripts/99-roles.sql <<'SQL'
        \set pgpass `echo "$$POSTGRES_PASSWORD"`
        ALTER USER authenticator WITH PASSWORD :'pgpass';
        ALTER USER pgbouncer WITH PASSWORD :'pgpass';
        ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
        SQL
        cat > /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql <<'SQL'
        \set jwt_exp `echo "$$JWT_EXP"`
        ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';
        SQL
        cat > /docker-entrypoint-initdb.d/migrations/99-realtime.sql <<'SQL'
        \set pguser `echo "$$POSTGRES_USER"`
        create schema if not exists _realtime;
        alter schema _realtime owner to :pguser;
        SQL
        exec docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf -c log_min_messages=fatal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY}
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    deploy:
      resources:
        limits:
          memory: 512M

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 10s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      # O site manda o cabeçalho "apikey"; no Supabase completo quem libera é o Kong
      GOTRUE_CORS_ALLOWED_HEADERS: apikey
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL}/auth/v1
      # Login com Google e com e-mail e senha (com confirmação por e-mail). Sem telefone nem anônimo.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      GOTRUE_EXTERNAL_EMAIL_MAGIC_LINK_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_OTP_EXP: 86400
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"
      # Envio de e-mails (confirmação de conta e nova senha) pelo servidor de e-mail da JMC
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: JMC Tecnologia e Consultoria
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirme o seu e-mail na Área do cliente JMC
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Crie uma nova senha na Área do cliente JMC
      # Modelos em português servidos pelo gateway (veja /emails/ no gateway abaixo)
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway/emails/confirmacao.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://gateway/emails/nova-senha.html
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_PUBLIC_URL}/auth/v1/callback
    deploy:
      resources:
        limits:
          memory: 128M

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]
    deploy:
      resources:
        limits:
          memory: 128M

  realtime:
    image: supabase/realtime:v2.134.10
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    deploy:
      resources:
        limits:
          memory: 384M

  meta:
    image: supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    deploy:
      resources:
        limits:
          memory: 160M

  studio:
    image: supabase/studio:2026.09.07-sha-7996410
    restart: unless-stopped
    depends_on:
      - meta
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      DEFAULT_ORGANIZATION_NAME: JMC Tecnologia
      DEFAULT_PROJECT_NAME: Área do cliente
      SUPABASE_URL: http://gateway:80
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
      NODE_OPTIONS: --max-old-space-size=256
    deploy:
      resources:
        limits:
          memory: 384M

  # Porta de entrada: /auth/v1, /rest/v1 e /realtime/v1 abertos (protegidos pelas chaves e pelas
  # regras do banco); o painel (Studio) na raiz, com usuário e senha.
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - realtime
      - studio
    environment:
      DASHBOARD_HTPASSWD_B64: ${DASHBOARD_HTPASSWD_B64}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "$$DASHBOARD_HTPASSWD_B64" | base64 -d > /etc/nginx/painel.htpasswd
        mkdir -p /usr/share/nginx/emails
        cat > /usr/share/nginx/emails/confirmacao.html <<'EMAIL'
        <!doctype html><html lang="pt-BR"><body style="margin:0;background:#f7f5f2;font-family:Arial,Helvetica,sans-serif;color:#1f1f1f">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f5f2;padding:32px 16px"><tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e7e2dc;border-radius:14px">
        <tr><td style="padding:28px 32px 0"><strong style="font-size:18px;color:#404040">JMC Tecnologia e Consultoria</strong></td></tr>
        <tr><td style="padding:16px 32px 8px"><h1 style="margin:0 0 12px;font-size:22px">Confirme o seu e-mail</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#555555">Recebemos o seu cadastro na Área do cliente da JMC. Clique no botão abaixo para ativar a sua conta. O link vale por 24 horas.</p>
        <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#ff9900;color:#1f1f1f;font-weight:bold;font-size:15px;text-decoration:none;padding:13px 26px;border-radius:999px">Confirmar e-mail</a>
        <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#555555">Se você não criou uma conta na JMC, ignore este e-mail.</p></td></tr>
        <tr><td style="padding:16px 32px 28px;font-size:12px;color:#888888">Este e-mail foi enviado para {{ .Email }} pela Área do cliente da JMC. Não responda esta mensagem.</td></tr>
        </table></td></tr></table></body></html>
        EMAIL
        cat > /usr/share/nginx/emails/nova-senha.html <<'EMAIL'
        <!doctype html><html lang="pt-BR"><body style="margin:0;background:#f7f5f2;font-family:Arial,Helvetica,sans-serif;color:#1f1f1f">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f5f2;padding:32px 16px"><tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e7e2dc;border-radius:14px">
        <tr><td style="padding:28px 32px 0"><strong style="font-size:18px;color:#404040">JMC Tecnologia e Consultoria</strong></td></tr>
        <tr><td style="padding:16px 32px 8px"><h1 style="margin:0 0 12px;font-size:22px">Crie uma nova senha</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#555555">Recebemos um pedido para trocar a senha da sua conta na Área do cliente da JMC. Clique no botão abaixo para criar uma nova senha. O link vale por 24 horas.</p>
        <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#ff9900;color:#1f1f1f;font-weight:bold;font-size:15px;text-decoration:none;padding:13px 26px;border-radius:999px">Criar nova senha</a>
        <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#555555">Se você não pediu a troca de senha, ignore este e-mail. A sua senha atual continua valendo.</p></td></tr>
        <tr><td style="padding:16px 32px 28px;font-size:12px;color:#888888">Este e-mail foi enviado para {{ .Email }} pela Área do cliente da JMC. Não responda esta mensagem.</td></tr>
        </table></td></tr></table></body></html>
        EMAIL
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        map $$http_upgrade $$connection_upgrade { default upgrade; '' close; }
        server {
          listen 80;
          client_max_body_size 10m;
          proxy_http_version 1.1;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host $$host;
          location /auth/v1/ {
            proxy_set_header Host $$host;
            proxy_pass http://auth:9999/;
          }
          location /rest/v1/ {
            proxy_set_header Host $$host;
            proxy_pass http://rest:3000/;
          }
          location /realtime/v1/ {
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header Host realtime-dev.supabase-realtime;
            proxy_read_timeout 3600s;
            proxy_pass http://realtime:4000/socket/;
          }
          location /emails/ {
            root /usr/share/nginx;
          }
          location / {
            auth_basic "Supabase JMC";
            auth_basic_user_file /etc/nginx/painel.htpasswd;
            proxy_set_header Host $$host;
            proxy_pass http://studio:3000;
          }
        }
        NGINX
        exec nginx -g 'daemon off;'
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  db-data:
  db-config:
